name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_LEAD_SOURCE: ${{ vars.NEXT_PUBLIC_LEAD_SOURCE }}
      NEXT_PUBLIC_LEAD_CLIENT_ID: ${{ vars.NEXT_PUBLIC_LEAD_CLIENT_ID }}
      NEXT_PUBLIC_SUPABASE_CAMPAIGN_BRIEFS_TABLE: ${{ vars.NEXT_PUBLIC_SUPABASE_CAMPAIGN_BRIEFS_TABLE }}
      NEXT_PUBLIC_SUPABASE_AD_CREATIVES_TABLE: ${{ vars.NEXT_PUBLIC_SUPABASE_AD_CREATIVES_TABLE }}
      NEXT_PUBLIC_MAKE_BRIEF_WEBHOOK_URL: ${{ secrets.NEXT_PUBLIC_MAKE_BRIEF_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Verify SEO artifacts
        run: |
          test -f out/index.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/og-image.jpg
          grep -q 'google-site-verification' out/index.html
          grep -q 'GTM-P2L473TN' out/index.html
          grep -q 'zguq0csup5' out/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

